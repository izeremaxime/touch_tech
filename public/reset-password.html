<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password — Touch Techhub</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body data-active-page="account">
  <div id="site-navbar"></div>

  <main style="padding: 40px 0 72px;">
    <div class="container" style="max-width: 460px;">
      <div class="auth-panel">
        <div class="auth-forms-wrap">
          <h1 style="font-size: 20px; margin-bottom: 6px;">Reset your password</h1>
          <p style="color: var(--color-text-muted); font-size: 13.5px; margin-bottom: 20px;">
            Choose a new password for your account.
          </p>

          <div id="reset-alert"></div>

          <form id="reset-form">
            <div class="form-group">
              <label for="reset-new-password" class="form-label">New Password</label>
              <input type="password" id="reset-new-password" class="form-input" placeholder="Min. 6 characters" required autocomplete="new-password">
            </div>
            <div class="form-group">
              <label for="reset-confirm-password" class="form-label">Confirm New Password</label>
              <input type="password" id="reset-confirm-password" class="form-input" placeholder="Retype password" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn--primary btn--full" style="height: 44px;">Reset Password</button>
          </form>

          <p style="text-align: center; margin-top: 16px;">
            <a href="/account.html" style="font-size: 13px; font-weight: 600; color: var(--color-accent);">Back to Login</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/reset-password.js"></script>
</body>
</html>
