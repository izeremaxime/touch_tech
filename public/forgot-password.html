<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password — Touch Techhub</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body data-active-page="account">
  <div id="site-navbar"></div>

  <main style="padding: 40px 0 72px;">
    <div class="container" style="max-width: 460px;">
      <div class="auth-panel">
        <div class="auth-forms-wrap">
          <h1 style="font-size: 20px; margin-bottom: 6px;">Forgot your password?</h1>
          <p style="color: var(--color-text-muted); font-size: 13.5px; margin-bottom: 20px;">
            Enter the email address you used to sign up and we'll send you a link to reset your password.
          </p>

          <div id="forgot-alert"></div>

          <form id="forgot-form">
            <div class="form-group">
              <label for="forgot-email" class="form-label">Email</label>
              <input type="email" id="forgot-email" class="form-input" placeholder="you@example.com" required autocomplete="email">
            </div>
            <button type="submit" class="btn btn--primary btn--full" style="height: 44px;">Send Reset Link</button>
          </form>

          <p style="text-align: center; margin-top: 16px;">
            <a href="/account.html" style="font-size: 13px; font-weight: 600; color: var(--color-accent);">Back to Login</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/forgot-password.js"></script>
</body>
</html>
